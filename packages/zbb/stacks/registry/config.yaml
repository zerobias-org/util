storage: /verdaccio/storage

auth:
  htpasswd:
    file: /verdaccio/conf/htpasswd
    max_users: -1

uplinks:
  github-packages:
    url: https://npm.pkg.github.com/
    auth:
      type: bearer
      token_env: GITHUB_TOKEN
    timeout: 30s
    max_fails: 3
    fail_timeout: 5m

  zerobias-org:
    url: https://pkg.zerobias.org/
    auth:
      type: bearer
      token_env: ZB_TOKEN
    timeout: 30s
    max_fails: 3
    fail_timeout: 5m

  npmjs:
    url: https://registry.npmjs.org/
    timeout: 30s
    max_fails: 3
    fail_timeout: 5m

publish:
  allow_unpublish: true
  # Verdaccio probes the uplink before accepting a PUT, to avoid clobbering a
  # version that already exists upstream. The @zerobias-org and @auditlogic
  # uplinks authenticate via ZB_TOKEN / GITHUB_TOKEN, so with neither set the
  # probe 401s, Verdaccio declares the uplink down and refuses the publish with
  # "503 ... one of the uplinks is down, refuse to publish".
  #
  # Reads are unaffected (they fall through to npmjs), which is why this only
  # bites on the publish path — i.e. exactly the Part1->2->3 handoff that
  # create-connector calls mandatory. Allowing offline publishes keeps the
  # local-registry bridge working for contributors with no ZeroBias credentials.
  allow_offline: true

packages:
  "@zerobias-com/*":
    access: $all
    publish: $all
    unpublish: $all
    proxy: github-packages

  "@zerobias-org/*":
    access: $all
    publish: $all
    unpublish: $all
    proxy: zerobias-org

  "@auditlogic/*":
    access: $all
    publish: $all
    unpublish: $all
    proxy: github-packages

  "**":
    access: $all
    publish: $all
    unpublish: $all
    proxy: npmjs

log:
  type: stdout
  format: pretty
  level: warn

web:
  enable: true
  title: "zbb local registry"

middlewares:
  audit:
    enabled: false
