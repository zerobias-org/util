services:
  minio:
    # minio/minio is no longer published; Chainguard builds MinIO from source.
    image: cgr.dev/chainguard/minio:latest
    # Root like the old image, so volumes it created stay writable.
    user: "0:0"
    container_name: ${ZB_SLOT}-minio
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - minio-data:/data
    labels:
      zerobias.slot: ${ZB_SLOT}

volumes:
  minio-data:
